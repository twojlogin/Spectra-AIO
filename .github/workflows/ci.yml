name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit
      - name: Compile
        run: python -m compileall -q backend cli.py auto_full_recon.py scripts/bootstrap.py
      - name: Import smoke
        run: PYTHONPATH=. python -c "import backend.main_backend, cli, auto_full_recon; print('OK')"
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt
